<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Expense Splitter{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="{{ url_for('dashboard.index') }}">💰 Expense Splitter</a>
  <div class="navlinks">
    {% if current_user %}
      <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
      <a href="{{ url_for('groups.list_groups') }}">Groups</a>
      <a href="{{ url_for('groups.create') }}">New Group</a>
      <span class="muted">{{ current_user.name }}</span>
      <a href="{{ url_for('auth.logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Log in</a>
      <a href="{{ url_for('auth.signup') }}">Sign up</a>
    {% endif %}
  </div>
</nav>
<main>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
