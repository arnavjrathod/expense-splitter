<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Expense Splitter{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="code-editor">
<div class="app-frame">
<nav class="topnav activity-bar">
  <a class="brand" href="{{ url_for('dashboard.index') }}"><span class="brand-icon">&lt;/&gt;</span> Expense Splitter</a>
  <div class="navlinks tabs">
    {% if current_user %}
      <a class="tab" href="{{ url_for('dashboard.index') }}">Dashboard</a>
      <a class="tab" href="{{ url_for('groups.list_groups') }}">Groups</a>
      <a class="tab" href="{{ url_for('groups.create') }}">New Group</a>
      <span class="user-pill muted">{{ current_user.name }}</span>
      <a class="tab" href="{{ url_for('auth.logout') }}">Log out</a>
    {% else %}
      <a class="tab" href="{{ url_for('auth.login') }}">Log in</a>
      <a class="tab" href="{{ url_for('auth.signup') }}">Sign up</a>
    {% endif %}
  </div>
</nav>
<main class="editor-panel">
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="status-bar">
  <span class="status-branch">main*</span>
  <span class="status-lang">Jinja2</span>
  <span class="status-enc">UTF-8</span>
</footer>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
