{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create your account</h1>
  <p class="muted small">Free — create or join groups and split expenses fairly.</p>
  <form method="post">
    <label>Name <input type="text" name="name" required autofocus></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" minlength="6" required></label>
    <div class="form-actions">
      <button type="submit">Create account</button>
    </div>
  </form>
  <p class="muted small">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
