{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Welcome back</h1>
  <p class="muted small">Log in to see your balances and settle up.</p>
  <form method="post">
    <label>Email <input type="email" name="email" required autofocus></label>
    <label>Password <input type="password" name="password" required></label>
    <div class="form-actions">
      <button type="submit">Log in</button>
    </div>
  </form>
  <p class="muted small">No account? <a href="{{ url_for('auth.signup', next=request.args.get('next')) }}">Sign up</a></p>
</div>
{% endblock %}
